services:
  - type: web
    name: chatbot-rag-mcp
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --log-level debug app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: research_paper_finder
      - key: DATABASE_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PDF_STORAGE_PATH
        value: storage/pdfs
      - key: RAG_TOP_K
        value: "5"
      - key: CHUNK_SIZE
        value: "600"
      - key: CHUNK_OVERLAP
        value: "80"
      - key: MAX_PAPERS_PER_SEARCH
        value: "20"
      - key: ENABLE_CACHE
        value: "true"
      - key: CACHE_TTL
        value: "3600"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        sync: false
