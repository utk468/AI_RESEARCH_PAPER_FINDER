<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Research Paper Details — AI Research Paper Finder" />
  <title>Paper Details — AI Research Paper Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=5" />
  <link rel="stylesheet" href="css/components.css?v=5" />
  <link rel="stylesheet" href="css/paper.css?v=5" />
  <link rel="stylesheet" href="css/responsive.css?v=5" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

</head>
<body>
  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <div class="page-wrapper">

    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="navbar-inner">
        <a href="index.html" class="navbar-brand">
          <span class="brand-name">Research<span>AI</span></span>
        </a>
        <div class="navbar-search">
          <div class="mini-search">
            <span class="mini-search-icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input id="mini-search-input" type="text" placeholder="New search..." aria-label="Quick search" />
            <button class="mini-search-btn" onclick="doMiniSearch()" aria-label="Search">Search</button>
          </div>
        </div>
        <nav class="navbar-nav">
          <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
          <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-bar"></i><span>Dashboard</span></a>
        </nav>
      </div>
    </nav>

    <div class="paper-hero" id="paper-hero">
      <div class="paper-hero-inner">
        <div class="breadcrumb" aria-label="Page location">
          <a href="index.html">Home</a>
          <span class="breadcrumb-sep" aria-hidden="true">›</span>
          <a href="dashboard.html" id="breadcrumb-search">Results</a>
          <span class="breadcrumb-sep" aria-hidden="true">›</span>
          <span id="breadcrumb-title">Paper</span>
        </div>

        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap">
          <div style="flex:1;min-width:0">
            <div class="flex gap-2 flex-wrap" style="margin-bottom:var(--space-3)" id="hero-badges"></div>
            <h1 class="paper-hero-title" id="paper-title">Loading paper...</h1>
            <div class="paper-hero-authors" id="paper-authors"></div>

            <div style="display:flex;align-items:center;gap:var(--space-5);flex-wrap:wrap;margin-top:var(--space-3)">
              <div class="citation-display" aria-label="Citation count">
                <i class="fa-solid fa-quote-right" style="color:var(--yellow)" aria-hidden="true"></i>
                <span class="citation-count" id="citation-count">—</span>
                <span>citations</span>
              </div>
              <div id="hero-doi" class="text-sm text-muted"></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <main id="main-content">
      <div class="paper-detail-layout">

        <div class="paper-detail-main">

          <div class="tabs" role="tablist" aria-label="Paper sections">
            <button class="tab-btn active" role="tab" data-tab="summary" onclick="switchPaperTab('summary')" id="ptab-summary">Summary</button>
            <button class="tab-btn" role="tab" data-tab="abstract" onclick="switchPaperTab('abstract')" id="ptab-abstract">Abstract</button>
            <button class="tab-btn" role="tab" data-tab="metadata" onclick="switchPaperTab('metadata')" id="ptab-metadata">Metadata</button>
            <button class="tab-btn" role="tab" data-tab="paper" onclick="switchPaperTab('paper')" id="ptab-paper">
              <i class="fa-solid fa-file-pdf" aria-hidden="true"></i> View Paper
            </button>
            <button class="tab-btn" role="tab" data-tab="chat" onclick="switchPaperTab('chat')" id="ptab-chat">
              <i class="fa-solid fa-comments" aria-hidden="true"></i> Chat
            </button>
          </div>

          <div id="ppanel-summary" class="tab-panel active" role="tabpanel">
            <div class="summary-panel" id="summary-content">
              <div class="summary-panel-header">
                <span class="summary-panel-title">AI-Generated Summary</span>
                <button class="btn btn-sm btn-ghost" onclick="regenerateSummary()" aria-label="Regenerate summary">
                  <i class="fa-solid fa-rotate" aria-hidden="true"></i> Regenerate
                </button>
              </div>
              <div class="summary-panel-body" id="summary-body">
                <div class="skeleton" style="height:20px;margin-bottom:8px"></div>
                <div class="skeleton" style="height:20px;width:80%;margin-bottom:8px"></div>
                <div class="skeleton" style="height:20px;width:60%"></div>
              </div>
            </div>
          </div>

          <div id="ppanel-abstract" class="tab-panel" role="tabpanel" style="display:none">
            <div style="display:flex;flex-direction:column;gap:var(--space-6)">

              <div class="sidebar-card">
                <div class="section-hdr"><i class="fa-solid fa-align-left" aria-hidden="true"></i> Narrative Abstract</div>
                <p id="abstract-text" class="abstract-paragraph"></p>
              </div>

              <div id="abstract-table-container"></div>

              <div class="sidebar-card">
                <div class="section-hdr"><i class="fa-solid fa-tag" aria-hidden="true"></i> Keywords</div>
                <div class="keywords-cloud" id="keywords-cloud"></div>
              </div>

            </div>
          </div>

          <div id="ppanel-metadata" class="tab-panel" role="tabpanel" style="display:none">
            <div class="sidebar-card">
              <div class="section-hdr"><i class="fa-solid fa-info-circle" aria-hidden="true"></i> Paper Metadata</div>
              <table class="meta-table" aria-label="Paper metadata" id="meta-table"></table>
            </div>
          </div>

          <div id="ppanel-paper" class="tab-panel" role="tabpanel" style="display:none">
            <div class="sidebar-card" style="height: 85vh; display: flex; flex-direction: column;">
              <div class="section-hdr" style="margin-bottom:var(--space-2)"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Full Paper Document</div>
              <div id="pdf-viewer-container" style="flex: 1; border-radius: var(--radius-md); overflow: hidden; background: #fff;">
              </div>
            </div>
          </div>

          <div id="ppanel-chat" class="tab-panel" role="tabpanel" style="display:none">
            <div class="chat-panel" aria-label="Chat with paper">
              <div class="summary-panel-header">
                <span class="summary-panel-title">
                  <i class="fa-solid fa-comments" aria-hidden="true"></i> Chat with Paper (RAG)
                </span>
                <button class="btn btn-sm btn-ghost" onclick="clearChat()" aria-label="Clear chat">
                  <i class="fa-solid fa-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>
              <div class="chat-input-area">
                <textarea
                  id="chat-input"
                  class="chat-input"
                  placeholder="Ask a question about this paper..."
                  rows="1"
                  aria-label="Chat message input"
                  onkeydown="chatKeyDown(event)"
                ></textarea>
                <button class="chat-send-btn" onclick="sendChat()" aria-label="Send message">
                  <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>

        </div>

        <aside class="paper-detail-sidebar" aria-label="Related information">

          <div class="sidebar-card" id="quick-info" aria-label="Quick paper information">
            <div class="section-hdr"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Quick Info</div>
            <div id="quick-info-content"></div>
          </div>

          <div id="pdf-banner-container"></div>

          <div class="sidebar-card" id="contributions-card" style="display:none" aria-label="Key contributions">
            <div class="section-hdr"><i class="fa-solid fa-trophy" aria-hidden="true"></i> Key Contributions</div>
            <div id="contributions-list"></div>
          </div>

          <div class="sidebar-card" id="related-card" aria-label="Related papers">
            <div class="section-hdr"><i class="fa-solid fa-link" aria-hidden="true"></i> Related Papers</div>
            <div id="related-list">
              <div class="skeleton" style="height:60px"></div>
              <div class="skeleton" style="height:60px"></div>
            </div>
          </div>

        </aside>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/components.js?v=2"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
